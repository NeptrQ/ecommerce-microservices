apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
spec:
  ingressClassName: nginx
  rules:
    - host: ecommerce.com
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 5011
          - path: /register
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 5011
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 5011
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 5011
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 5011
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 5011
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 5011
