
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ecommerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        # Main Gateway application
        - name: gateway
          image: toritoru/gateway:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
              name: http

          envFrom:
            - configMapRef:
                name: ecommerce-config

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: JWT_SECRET

          volumeMounts:
            - name: shared-volume
              mountPath: /shared-logs

        # Sidecar container: reads Gateway logs
        - name: log-reader
          image: busybox:1.36
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              while [ ! -f /shared-logs/gateway.log ]; do
                sleep 1
              done
              tail -F /shared-logs/gateway.log

          volumeMounts:
            - name: shared-volume
              mountPath: /shared-logs
              readOnly: true

      # Shared volume accessible by both containers
      volumes:
        - name: shared-volume
          emptyDir: {}
