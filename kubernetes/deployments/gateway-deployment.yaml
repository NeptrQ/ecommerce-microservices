
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ecommerce
spec:
  replicas: 2

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway
          image: toritoru/gateway:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
              name: http

          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: JWT_SECRET

