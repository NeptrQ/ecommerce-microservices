apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ecommerce-microservices-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5001"
            - name: LOG_DIR
              value: /shared-logs
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: JWT_SECRET
          volumeMounts:
            - name: shared-logs
              mountPath: /shared-logs
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
              
        - name: log-reader
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while [ ! -f /shared-logs/auth-service.log ]; do
                sleep 1
              done
              tail -F /shared-logs/auth-service.log
          volumeMounts:
            - name: shared-logs
              mountPath: /shared-logs
              readOnly: true
      volumes:
        - name: shared-logs
          emptyDir: {}