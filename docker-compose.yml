services:
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ecommerce_auth
    restart: unless-stopped
    environment:
      PORT: 5001
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

  login-service:
    build:
      context: .
      dockerfile: login-service/Dockerfile
    container_name: ecommerce_login
    restart: unless-stopped
    environment:
      PORT: 5002
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

  register-service:
    build:
      context: .
      dockerfile: register-service/Dockerfile
    container_name: ecommerce_register
    restart: unless-stopped
    environment:
      PORT: 5003
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ecommerce_order
    restart: unless-stopped
    environment:
      PORT: 5004
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: ecommerce_product
    restart: unless-stopped
    environment:
      PORT: 5005
      MONGO_URI: ${MONGO_URI:?set MONGO_URI in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce_gateway
    restart: unless-stopped
    environment:
      PORT: 5000
      AUTH_URL: http://auth-service:5001
      LOGIN_URL: http://login-service:5002
      REGISTER_URL: http://register-service:5003
      ORDER_URL: http://order-service:5004
      PRODUCT_URL: http://product-service:5005
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      - auth-service
      - login-service
      - register-service
      - order-service
      - product-service
    ports:
      - "${GATEWAY_HOST_PORT:-5011}:5000"
